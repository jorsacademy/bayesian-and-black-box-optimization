name: Consolidate related repositories

on:
  push:
    paths:
      - ".github/workflows/consolidate-related-repos.yml"

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy source repositories
        shell: bash
        run: |
          set -euo pipefail
          sources=(
            sambo-sequential-model-based-optimization
            nevergrad-black-box-policy-optimization
            smac3-simulation-based-optimization
            botorch-bayesian-policy-search
            processoptimizer-industrial-process-optimization
          )
          mkdir -p projects
          for repo in "${sources[@]}"; do
            if [ -d "projects/$repo" ]; then
              echo "Skipping existing projects/$repo"
              continue
            fi
            tmp="$(mktemp -d)"
            git clone --depth 1 "https://github.com/jorsacademy/$repo.git" "$tmp/repo"
            sha="$(git -C "$tmp/repo" rev-parse HEAD)"
            rm -rf "$tmp/repo/.git"
            mkdir -p "projects/$repo"
            cp -a "$tmp/repo/." "projects/$repo/"
            cat > "projects/$repo/SOURCE_REPOSITORY.md" <<EOF
          # Source repository

          Copied from https://github.com/jorsacademy/$repo

          Source commit: `$sha`

          The original repository remains unchanged.
          EOF
            rm -rf "$tmp"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects
          if git diff --cached --quiet; then
            echo "No new files to commit."
            exit 0
          fi
          git commit -m "Consolidate Bayesian optimization project family"
          git push
