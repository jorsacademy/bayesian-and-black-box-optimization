[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smac3-simulation-based-optimization"
version = "0.1.0"
description = "Simulation-based optimization of a stochastic production policy with SMAC3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ConfigSpace>=1.2,<2",
  "numpy>=1.26,<3",
  "scikit-learn>=1.6.1,<1.9",
  "smac==2.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
smac3-production-demo = "smac_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=smac_sim --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
