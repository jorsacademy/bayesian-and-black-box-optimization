[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sambo-sequential-model-based-optimization"
version = "0.1.0"
description = "Sequential model-based optimization of an (s, S) inventory policy with SAMBO"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "joblib>=1.3",
  "scikit-learn>=1.3",
  "sambo>=1.25.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=sambo_inventory --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
